name: RDKit Ubuntu 26.04 reference

on:
  push:
    branches:
      - codex/ubuntu-26.04-rdkit-2026.09
    tags:
      - ubuntu-26.04-rdkit-2026.09.1-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdkit-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Ubuntu 26.04 builder
        run: |
          docker build --tag rdkit-reference-builder .
          mkdir -p dist
          docker run --rm -v rdkit-build:/build -v "$PWD/dist:/out" rdkit-reference-builder ./build.sh prepare
      - name: Compile and package without network
        env:
          PACKAGING_COMMIT: ${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          docker run --rm --network none -v rdkit-build:/build -v "$PWD/dist:/out" \
            -e PACKAGING_COMMIT -e WORKFLOW_URL -e BUILD_JOBS=3 \
            rdkit-reference-builder ./build.sh build 2>&1 | tee build.log
      - name: Check package metadata and lint
        run: |
          set -o pipefail
          docker run --rm --network none -v "$PWD/dist:/out:ro" \
            rdkit-reference-builder ./scripts/check-packages.sh 2>&1 | tee lint.log
      - name: Install and test on a clean Ubuntu 26.04 image
        run: |
          set -o pipefail
          source sources.lock
          docker run --rm -v "$PWD:/packaging:ro" -v "$PWD/dist:/out:ro" \
            "$UBUNTU_IMAGE" bash /packaging/scripts/test-install.sh 2>&1 | tee install-test.log
      - name: Record verification evidence
        run: |
          sudo cp build.log lint.log install-test.log dist/
          sudo python3 scripts/checksums.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rdkit-ubuntu26.04-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed-build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-logs-${{ matrix.arch }}
          path: '*.log'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/ubuntu-26.04-rdkit-')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: rdkit-ubuntu26.04-*
      - name: Verify and assemble release assets
        run: bash scripts/release-assets.sh
      - name: Publish tested packages from this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "RDKit 2026.09.1 for Ubuntu 26.04" --notes-file release-notes.md

  s3-access:
    if: github.event_name != 'pull_request' && github.repository == 'rdkit-rs/rdkit-debian'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify existing S3 repository access and trust
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          AWS_EC2_METADATA_DISABLED: true
        run: bash scripts/s3-preflight.sh

  publish-s3:
    if: startsWith(github.ref, 'refs/tags/ubuntu-26.04-rdkit-')
    needs: [release, s3-access]
    runs-on: ubuntu-24.04
    concurrency:
      group: rdkit-s3-resolute
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: rdkit-ubuntu26.04-*
      - name: Assemble verified assets
        run: |
          bash scripts/release-assets.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby
      - name: Update existing S3 APT repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          AWS_EC2_METADATA_DISABLED: true
        run: bash scripts/publish-s3.sh

  apt-install:
    needs: publish-s3
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the published packages through APT
        run: |
          set -o pipefail
          source sources.lock
          docker run --rm -v "$PWD:/packaging:ro" "$UBUNTU_IMAGE" \
            bash /packaging/scripts/test-apt.sh 2>&1 | tee apt-install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apt-install-${{ matrix.arch }}
          path: apt-install.log
